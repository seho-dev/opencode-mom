name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate (empty uses the triggering commit)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !inputs.ref && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.ref }}

env:
  HUSKY: '0'

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'

      - name: Classify changed paths
        id: changes
        env:
          CI_REF: ${{ inputs.ref }}
        run: node scripts/ci-changes.mjs

  frontend:
    name: Frontend validation and build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test release version handling and CI change detection
        run: node --test scripts/release-version.test.mjs scripts/ci-changes.test.mjs

      - name: Check app version sources
        id: version
        run: |
          node --input-type=module -e 'import { verifyVersions } from "./scripts/release-version.mjs"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_OUTPUT, `version=${verifyVersions(process.cwd())}\n`);'

      - name: Check frontend format and lint
        run: npm run check

      - name: Setup Rust 1.96.0 with rustfmt
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check macOS helper formatting
        run: cargo fmt --manifest-path src-tauri/native/macos-helper/Cargo.toml --all -- --check

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run frontend component tests
        run: npm run test:components

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.run_id }}
          path: build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  native-checks-windows:
    name: Windows Rust checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Rust 1.96.0 with Clippy
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust check outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: native-checks-x86_64-pc-windows-msvc
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ !inputs.ref || github.ref == 'refs/heads/main' }}

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run Rust backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  native-checks-macos:
    name: macOS Rust checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Rust 1.96.0 with Clippy
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
          targets: aarch64-apple-darwin

      - name: Cache Rust check outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/native/macos-helper -> target
          shared-key: native-checks-aarch64-apple-darwin
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ !inputs.ref || github.ref == 'refs/heads/main' }}

      - name: Fetch macOS helper dependencies
        run: cargo fetch --manifest-path src-tauri/native/macos-helper/Cargo.toml --locked --target aarch64-apple-darwin

      - name: Check macOS helper
        run: cargo check --manifest-path src-tauri/native/macos-helper/Cargo.toml --all-targets --offline --locked

      - name: Test macOS helper
        run: cargo test --manifest-path src-tauri/native/macos-helper/Cargo.toml --offline --locked

      - name: Lint macOS helper
        run: cargo clippy --manifest-path src-tauri/native/macos-helper/Cargo.toml --all-targets --offline --locked -- -D warnings

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run Rust backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  native-package-windows:
    name: Windows Tauri package
    needs: [changes, frontend]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.96.0 with Clippy
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust package outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: native-package-x86_64-pc-windows-msvc
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ !inputs.ref || github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.run_id }}
          path: build/

      - name: Verify downloaded frontend build
        run: test -f build/index.html

      - name: Build Windows Tauri package
        run: npm run tauri -- build --ci --target x86_64-pc-windows-msvc --bundles nsis --config '{"build":{"beforeBuildCommand":null}}' -- --locked

      - name: Ensure the build did not change app versions or locks
        run: git diff --exit-code -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/native/macos-helper/Cargo.toml src-tauri/native/macos-helper/Cargo.lock

      - name: Assert exact Windows NSIS artifact
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.frontend.outputs.version }}
        run: |
          $artifact = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/opencode-mom_$($env:APP_VERSION)_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Expected exact NSIS artifact: $artifact"
          }

      - name: Upload Windows Tauri evidence
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mom-tauri-windows-${{ needs.frontend.outputs.version }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/opencode-mom_${{ needs.frontend.outputs.version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: ${{ inputs.ref != '' && 14 || 3 }}
          overwrite: true

  native-package-macos:
    name: macOS Tauri package
    needs: [changes, frontend]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.frontend.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.96.0 with Clippy
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
          targets: aarch64-apple-darwin

      - name: Cache Rust package outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/native/macos-helper -> target
          shared-key: native-package-aarch64-apple-darwin
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ !inputs.ref || github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.run_id }}
          path: build/

      - name: Verify downloaded frontend build
        run: test -f build/index.html

      - name: Fetch macOS helper dependencies
        run: cargo fetch --manifest-path src-tauri/native/macos-helper/Cargo.toml --locked --target aarch64-apple-darwin

      - name: Build macOS Tauri packages
        run: npm run tauri -- build --ci --target aarch64-apple-darwin --bundles app,dmg --config '{"build":{"beforeBuildCommand":null}}' -- --locked

      - name: Ensure the build did not change app versions or locks
        run: git diff --exit-code -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/native/macos-helper/Cargo.toml src-tauri/native/macos-helper/Cargo.lock

      - name: Assert exact macOS app and DMG artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos/opencode-mom.app'
          test -f "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/opencode-mom_${APP_VERSION}_aarch64.dmg"
          mkdir -p release-assets
          cp "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/opencode-mom_${APP_VERSION}_aarch64.dmg" release-assets/

      - name: Archive macOS app for release
        if: inputs.ref != ''
        shell: bash
        run: |
          tar -czf "release-assets/opencode-mom_${APP_VERSION}_aarch64.app.tar.gz" \
            -C src-tauri/target/aarch64-apple-darwin/release/bundle/macos opencode-mom.app

      - name: Upload macOS Tauri evidence
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mom-tauri-macos-${{ needs.frontend.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: ${{ inputs.ref != '' && 14 || 3 }}
          overwrite: true

  tauri-windows:
    name: Tauri Windows required gate
    needs: [changes, frontend, native-checks-windows, native-package-windows, rust-msrv]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks or a documentation-only skip
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CHECKS_RESULT: ${{ needs.native-checks-windows.result }}
          PACKAGE_RESULT: ${{ needs.native-package-windows.result }}
          MSRV_RESULT: ${{ needs.rust-msrv.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          case "$CODE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo 'Missing or invalid code-change output' >&2; exit 1 ;;
          esac
          for result in "$FRONTEND_RESULT" "$CHECKS_RESULT" "$PACKAGE_RESULT" "$MSRV_RESULT"; do
            test "$result" = "$expected"
          done

  tauri-macos:
    name: Tauri macOS required gate
    needs: [changes, frontend, native-checks-macos, native-package-macos, rust-msrv]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks or a documentation-only skip
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CHECKS_RESULT: ${{ needs.native-checks-macos.result }}
          PACKAGE_RESULT: ${{ needs.native-package-macos.result }}
          MSRV_RESULT: ${{ needs.rust-msrv.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          case "$CODE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo 'Missing or invalid code-change output' >&2; exit 1 ;;
          esac
          for result in "$FRONTEND_RESULT" "$CHECKS_RESULT" "$PACKAGE_RESULT" "$MSRV_RESULT"; do
            test "$result" = "$expected"
          done

  rust-msrv:
    name: Rust minimum supported versions
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup helper Rust 1.77.2
        uses: dtolnay/rust-toolchain@1.77.2

      - name: Setup backend Rust 1.90.0
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/native/macos-helper -> target
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ !inputs.ref || github.ref == 'refs/heads/main' }}

      - name: Fetch macOS helper dependencies
        run: cargo +1.90.0 fetch --manifest-path src-tauri/native/macos-helper/Cargo.toml --locked --target aarch64-apple-darwin

      - name: Fetch macOS helper dependencies for MSRV
        run: cargo +1.77.2 fetch --manifest-path src-tauri/native/macos-helper/Cargo.toml --locked --target aarch64-apple-darwin

      - name: Check Rust backend MSRV
        run: cargo +1.90.0 check --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Check macOS helper MSRV
        run: cargo +1.77.2 check --manifest-path src-tauri/native/macos-helper/Cargo.toml --all-targets --offline --locked

      - name: Test macOS helper MSRV
        run: cargo +1.77.2 test --manifest-path src-tauri/native/macos-helper/Cargo.toml --offline --locked
