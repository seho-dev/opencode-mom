name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  tauri-windows:
    name: Tauri Windows required gate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.96.0 with rustfmt
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Assert product config, security, identity, removed scope, and CI contract
        shell: pwsh
        env:
          OMO_CHARACTERIZE_NATIVE_GAPS: '1'
        run: npm test -- --run src/native-gaps.test.ts

      - name: Build Windows Tauri package
        run: npm run tauri build

      - name: Assert exact Windows NSIS artifact
        shell: pwsh
        run: |
          $artifact = 'src-tauri/target/release/bundle/nsis/omo-switch_0.1.0_x64-setup.exe'
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Expected exact NSIS artifact: $artifact"
          }

      - name: Upload Windows Tauri evidence
        uses: actions/upload-artifact@v4
        with:
          name: omo-switch-tauri-windows-0.1.0
          path: src-tauri/target/release/bundle/nsis/omo-switch_0.1.0_x64-setup.exe
          if-no-files-found: error

  tauri-macos:
    name: Tauri macOS required gate
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.96.0 with rustfmt
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Assert product config, security, identity, removed scope, and CI contract
        env:
          OMO_CHARACTERIZE_NATIVE_GAPS: '1'
        run: npm test -- --run src/native-gaps.test.ts

      - name: Build macOS Tauri packages
        run: npm run tauri build

      - name: Assert exact macOS app and DMG artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d 'src-tauri/target/release/bundle/macos/omo-switch.app'
          test -f 'src-tauri/target/release/bundle/dmg/omo-switch_0.1.0_aarch64.dmg'

      - name: Upload macOS Tauri evidence
        uses: actions/upload-artifact@v4
        with:
          name: omo-switch-tauri-macos-0.1.0
          path: |
            src-tauri/target/release/bundle/macos/omo-switch.app
            src-tauri/target/release/bundle/dmg/omo-switch_0.1.0_aarch64.dmg
          if-no-files-found: error
