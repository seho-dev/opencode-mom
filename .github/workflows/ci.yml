name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  tauri-windows:
    name: Tauri Windows required gate
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Test release version handling
        run: node --test scripts/release-version.test.mjs

      - name: Check app version sources
        id: version
        shell: bash
        run: |
          node --input-type=module -e 'import { verifyVersions } from "./scripts/release-version.mjs"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_OUTPUT, `version=${verifyVersions(process.cwd())}\n`);'

      - name: Setup Rust 1.96.0 with rustfmt
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend format and lint
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Build Windows Tauri package
        run: npm run tauri -- build --ci --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Assert exact Windows NSIS artifact
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $artifact = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/opencode-mom_$($env:APP_VERSION)_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Expected exact NSIS artifact: $artifact"
          }

      - name: Upload Windows Tauri evidence
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mom-tauri-windows-${{ steps.version.outputs.version }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/opencode-mom_${{ steps.version.outputs.version }}_x64-setup.exe
          if-no-files-found: error

  tauri-macos:
    name: Tauri macOS required gate
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Test release version handling
        run: node --test scripts/release-version.test.mjs

      - name: Check app version sources
        id: version
        run: |
          node --input-type=module -e 'import { verifyVersions } from "./scripts/release-version.mjs"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_OUTPUT, `version=${verifyVersions(process.cwd())}\n`);'

      - name: Setup Rust 1.96.0 with rustfmt
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend format and lint
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Build macOS Tauri packages
        run: |
          cargo fetch --manifest-path src-tauri/native/macos-helper/Cargo.toml --locked --target aarch64-apple-darwin
          npm run tauri -- build --ci --target aarch64-apple-darwin --bundles app,dmg -- --locked

      - name: Assert exact macOS app and DMG artifacts
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -d 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos/opencode-mom.app'
          test -f "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/opencode-mom_${APP_VERSION}_aarch64.dmg"

      - name: Upload macOS Tauri evidence
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mom-tauri-macos-${{ steps.version.outputs.version }}
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/opencode-mom_${{ steps.version.outputs.version }}_aarch64.dmg
          if-no-files-found: error
