name: Debug Windows
on:
  push:
    branches: ["debug/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: debug-win
      - name: Full suite, parallel (baseline)
        continue-on-error: true
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib 2>&1 | grep -E "^(test result|failures:)|^    [a-z_]+::" | head -45
      - name: Full suite, serial
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- --test-threads=1 2>&1 | grep -E "^(test result|failures:)|^    [a-z_]+::" | head -45
