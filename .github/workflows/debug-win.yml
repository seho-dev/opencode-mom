name: Debug Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: debug-win
      - name: Probe IPC origin and plugin envelope
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- --nocapture --test-threads=1 win_probe_origin_matrix 2>&1 | tail -40
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- --nocapture --test-threads=1 declaration_removal_preserves 2>&1 | tail -30
