name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable X.Y.Z (empty = next patch); run on the default branch'
        required: false
        type: string

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-prepare-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Test release version handling
        run: node --test scripts/release-version.test.mjs
      - name: Configure release commit author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare or verify release
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release-version.mjs prepare

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            arch: x64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
          targets: ${{ matrix.target }}
      - name: Verify tagged app versions
        run: node scripts/release-version.mjs verify "$RELEASE_TAG"
      - run: npm ci
      - name: Prefetch standalone macOS helper dependencies
        if: runner.os == 'macOS'
        run: cargo fetch --manifest-path src-tauri/native/macos-helper/Cargo.toml --locked --target "$TARGET"
      - name: Build platform bundles (macOS ad-hoc signed, no notarization)
        run: npm run tauri -- build --ci --target "$TARGET" --bundles "$BUNDLES" -- --locked
      - name: Ensure the build did not change app versions or locks
        run: git diff --exit-code -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/native/macos-helper/Cargo.toml src-tauri/native/macos-helper/Cargo.lock
      - name: Collect macOS app and DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          cp "src-tauri/target/$TARGET/release/bundle/dmg/"*.dmg release-assets/
          tar -czf "release-assets/opencode-mom_${RELEASE_VERSION}_${ARCH}.app.tar.gz" \
            -C "src-tauri/target/$TARGET/release/bundle/macos" opencode-mom.app
      - name: Collect Windows NSIS installer
        if: runner.os == 'Windows'
        run: |
          mkdir -p release-assets
          cp "src-tauri/target/$TARGET/release/bundle/nsis/"*.exe release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish only after every platform succeeded
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          test "$(find release-assets -type f | wc -l)" -eq 5
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes \
              --notes 'macOS: Apple Silicon and Intel builds are ad-hoc signed, not Developer ID signed or notarized. Windows: the x64 NSIS installer is unsigned and may show SmartScreen warnings. Download only from this official Releases page; see the README for scoped first-launch trust steps. Updates are installed manually; review Settings after upgrading.'
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
