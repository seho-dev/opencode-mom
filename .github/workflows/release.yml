name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Tauri Windows NSIS
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert release tag matches Tauri version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must exactly match Tauri version '$expectedTag'."
          }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows Tauri package
        run: npm run tauri build

      - name: Assert exact Windows NSIS artifact
        shell: pwsh
        run: |
          $artifact = 'src-tauri/target/release/bundle/nsis/opencode-mom_0.1.0_x64-setup.exe'
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Expected exact NSIS artifact: $artifact"
          }

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mom-tauri-windows-0.1.0
          path: src-tauri/target/release/bundle/nsis/opencode-mom_0.1.0_x64-setup.exe
          if-no-files-found: error

  build-macos:
    name: Build Tauri macOS app and DMG
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert release tag matches Tauri version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            printf 'Release tag %s must exactly match Tauri version %s.\n' "${GITHUB_REF_NAME}" "${expected_tag}" >&2
            exit 1
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS Tauri packages
        run: npm run tauri build

      - name: Assert exact macOS app and DMG artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d 'src-tauri/target/release/bundle/macos/opencode-mom.app'
          test -f 'src-tauri/target/release/bundle/dmg/opencode-mom_0.1.0_aarch64.dmg'

      - name: Package macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -C 'src-tauri/target/release/bundle/macos' -czf 'release-assets/opencode-mom_0.1.0_aarch64.app.tar.gz' 'opencode-mom.app'
          cp 'src-tauri/target/release/bundle/dmg/opencode-mom_0.1.0_aarch64.dmg' 'release-assets/opencode-mom_0.1.0_aarch64.dmg'
          test -f 'release-assets/opencode-mom_0.1.0_aarch64.app.tar.gz'
          test -f 'release-assets/opencode-mom_0.1.0_aarch64.dmg'

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mom-tauri-macos-0.1.0
          path: |
            release-assets/opencode-mom_0.1.0_aarch64.app.tar.gz
            release-assets/opencode-mom_0.1.0_aarch64.dmg
          if-no-files-found: error

  publish:
    name: Publish Tauri release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: opencode-mom-tauri-windows-0.1.0
          path: release-assets/windows

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: opencode-mom-tauri-macos-0.1.0
          path: release-assets/macos

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/opencode-mom_0.1.0_x64-setup.exe
            release-assets/macos/opencode-mom_0.1.0_aarch64.app.tar.gz
            release-assets/macos/opencode-mom_0.1.0_aarch64.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
