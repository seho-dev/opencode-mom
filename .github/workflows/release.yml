name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable X.Y.Z (empty = next patch); run on the default branch'
        required: false
        type: string
      dry_run:
        description: 'Preview validation, version and changelog without committing, building or publishing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-prepare-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Test release version handling
        run: node --test scripts/release-version.test.mjs
      - name: Configure release commit author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare or verify release
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release-version.mjs prepare

  validation:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: read
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-apple-darwin
      BUNDLES: app,dmg
      ARCH: x64
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/native/macos-helper -> target
          shared-key: native-package-x86_64-apple-darwin
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify tagged app versions
        run: node scripts/release-version.mjs verify "$RELEASE_TAG"
      - run: npm ci
      - name: Prefetch standalone macOS helper dependencies
        run: cargo fetch --manifest-path src-tauri/native/macos-helper/Cargo.toml --locked --target "$TARGET"
      - name: Build platform bundles (macOS ad-hoc signed, no notarization)
        run: npm run tauri -- build --ci --target "$TARGET" --bundles "$BUNDLES" -- --locked
      - name: Ensure the build did not change app versions or locks
        run: git diff --exit-code -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/native/macos-helper/Cargo.toml src-tauri/native/macos-helper/Cargo.lock
      - name: Collect macOS app and DMG
        run: |
          test -d "src-tauri/target/$TARGET/release/bundle/macos/opencode-mom.app"
          test -f "src-tauri/target/$TARGET/release/bundle/dmg/opencode-mom_${RELEASE_VERSION}_${ARCH}.dmg"
          mkdir -p release-assets
          cp "src-tauri/target/$TARGET/release/bundle/dmg/opencode-mom_${RELEASE_VERSION}_${ARCH}.dmg" release-assets/
          tar -czf "release-assets/opencode-mom_${RELEASE_VERSION}_${ARCH}.app.tar.gz" \
            -C "src-tauri/target/$TARGET/release/bundle/macos" opencode-mom.app
      - uses: actions/upload-artifact@v4
        with:
          name: release-x86_64-apple-darwin
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    needs: [prepare, validation, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      # Reuse the validated ARM macOS and Windows packages without rebuilding them.
      - uses: actions/download-artifact@v4
        with:
          name: opencode-mom-tauri-windows-${{ needs.prepare.outputs.version }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: opencode-mom-tauri-macos-${{ needs.prepare.outputs.version }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-x86_64-apple-darwin
          path: release-assets
      - name: Publish only after every platform succeeded
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          test "$(find release-assets -type f | wc -l)" -eq 5
          test -f "release-assets/opencode-mom_${RELEASE_VERSION}_aarch64.dmg"
          test -f "release-assets/opencode-mom_${RELEASE_VERSION}_x64.dmg"
          test -f "release-assets/opencode-mom_${RELEASE_VERSION}_aarch64.app.tar.gz"
          test -f "release-assets/opencode-mom_${RELEASE_VERSION}_x64.app.tar.gz"
          test -f "release-assets/opencode-mom_${RELEASE_VERSION}_x64-setup.exe"
          notes_file="$(mktemp "$RUNNER_TEMP/release-notes.XXXXXX")"
          trap 'rm -f "$notes_file"' EXIT
          node scripts/release-version.mjs notes "$RELEASE_TAG" > "$notes_file"
          printf '\n%s\n' 'macOS: Apple Silicon and Intel builds are ad-hoc signed, not Developer ID signed or notarized. Windows: the x64 NSIS installer is unsigned and may show SmartScreen warnings. Download only from this official Releases page; see the README for scoped first-launch trust steps. Updates are installed manually; review Settings after upgrading.' >> "$notes_file"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$notes_file"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --notes-file "$notes_file"
