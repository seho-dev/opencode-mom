[package]
name = "omo-switch"
version = "0.1.0"
description = "Cross-platform desktop model group switcher"
authors = ["omo-switch contributors"]
edition = "2021"
rust-version = "1.77.2"
default-run = "omo-switch"

[package.metadata]

[lib]
name = "omo_switch_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.10.2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-positioner = { version = "2.3.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.3.4"
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known"] }
uuid = { version = "1.11", features = ["serde", "v4"] }

[dev-dependencies]
