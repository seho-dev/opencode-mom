[package]
name = "opencode-lid-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"

[dependencies]
libc = "=0.2.186"

[profile.release]
panic = "abort"
strip = true
